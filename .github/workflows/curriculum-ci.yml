name: Curriculum CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run curriculum validator
        run: python scripts/validate_curriculum.py

      - name: Run validator mutation tests
        run: python -m unittest discover -s tests -v
