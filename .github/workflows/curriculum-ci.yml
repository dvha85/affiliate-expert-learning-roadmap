name: Curriculum CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run curriculum validator
        run: python scripts/validate_curriculum.py

      - name: Run hardening validator
        run: python scripts/validate_hardening.py

      - name: Run validator mutation tests
        run: python -m unittest discover -s tests -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: lab/affiliate-bot/go.mod

      - name: Test bootstrap Affiliate Bot
        working-directory: lab/affiliate-bot
        run: go test ./...
