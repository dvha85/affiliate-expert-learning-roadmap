name: Curriculum CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  curriculum:
    name: curriculum
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate canonical authority
        run: python scripts/validate_canonical_authority.py

      - name: Validate curriculum structure
        run: python scripts/validate_curriculum.py

      - name: Validate legacy lesson projection compatibility
        run: python scripts/validate_lesson_v2_map.py

      - name: Validate Mission authoring state
        run: python scripts/validate_mission_status.py

      - name: Validate Mission readiness metadata
        run: python scripts/validate_readiness.py

      - name: Validate Vietnamese language policy
        run: python scripts/validate_language_policy.py

      - name: Validate Vietnamese headings
        run: python scripts/validate_vietnamese_headings.py

  evidence-and-safety:
    name: evidence-and-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate learner-evidence privacy boundary
        run: python scripts/validate_privacy_boundary.py

      - name: Validate O00 synthetic safety
        run: python scripts/validate_o00.py

      - name: Validate contract registry
        run: python scripts/validate_contract_registry.py

      - name: Validate M00 market-loop pack
        run: python scripts/validate_m00_market_loop_pack.py

      - name: Validate M00 evidence bundle
        run: python scripts/validate_m00_market_evidence_bundle.py

      - name: Validate M01 outcome snapshot compatibility pack
        run: python scripts/validate_m01_outcome_snapshot_pack.py

      - name: Validate M02 deterministic compatibility pack
        run: python scripts/validate_m02_deterministic_pack.py

      - name: Validate M02 operator profile compatibility
        run: python scripts/validate_m02_profile_parity.py --operator-only

      - name: Validate M03 history compatibility pack
        run: python scripts/validate_m03_history_pack.py

      - name: Validate M04 grounded advisory pack
        run: python scripts/validate_m04_grounded_advisory_pack.py

      - name: Validate M05 reviewed improvement pack
        run: python scripts/validate_m05_reviewed_improvement_pack.py

      - name: Validate evidence taxonomy
        run: python scripts/validate_evidence_taxonomy.py

      - name: Validate authority boundaries
        run: python scripts/validate_authority.py

      - name: Validate hardening rules
        run: python scripts/validate_hardening.py

      - name: Validate Build-First semantics
        run: python scripts/validate_build_first.py

      - name: Validate Agentic Architecture
        run: python scripts/validate_agentic_architecture.py

      - name: Validate Hybrid Runtime
        run: python scripts/validate_hybrid_runtime.py

  python-regression:
    name: python-regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v

  deterministic-runtime:
    name: deterministic-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: lab/affiliate-bot/go.mod

      - name: Check reference Go formatting
        working-directory: lab/affiliate-bot
        run: test -z "$(gofmt -l .)"

      - name: Vet reference Affiliate Bot
        working-directory: lab/affiliate-bot
        run: go vet ./...

      - name: Test reference Affiliate Bot
        working-directory: lab/affiliate-bot
        run: go test ./...

      - name: Check learner Go formatting
        working-directory: lab/learner/affiliate-bot
        run: test -z "$(gofmt -l .)"

      - name: Vet learner Affiliate Bot
        working-directory: lab/learner/affiliate-bot
        run: go vet ./...

      - name: Test learner Affiliate Bot
        working-directory: lab/learner/affiliate-bot
        run: go test ./...

      - name: Check retained profile parity
        run: python scripts/validate_m02_profile_parity.py
