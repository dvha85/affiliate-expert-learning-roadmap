name: Curriculum CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run curriculum validator
        run: python scripts/validate_curriculum.py

      - name: Run Mission authoring-state validator
        run: python scripts/validate_mission_status.py

      - name: Run Mission readiness metadata validator
        run: python scripts/validate_readiness.py

      - name: Run evidence taxonomy validator
        run: python scripts/validate_evidence_taxonomy.py

      - name: Run authority drift validator
        run: python scripts/validate_authority.py

      - name: Run Vietnamese language policy validator
        run: python scripts/validate_language_policy.py

      - name: Run Vietnamese heading validator
        run: python scripts/validate_vietnamese_headings.py

      - name: Run hardening validator
        run: python scripts/validate_hardening.py

      - name: Run Build-First semantic validator
        run: python scripts/validate_build_first.py

      - name: Run Agentic Architecture validator
        run: python scripts/validate_agentic_architecture.py

      - name: Run Hybrid Runtime validator
        run: python scripts/validate_hybrid_runtime.py

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: lab/affiliate-bot/go.mod

      - name: Check reference Go formatting
        working-directory: lab/affiliate-bot
        run: test -z "$(gofmt -l .)"

      - name: Vet reference Affiliate Bot
        working-directory: lab/affiliate-bot
        run: go vet ./...

      - name: Test reference Affiliate Bot
        working-directory: lab/affiliate-bot
        run: go test ./...

      - name: Check learner Go formatting
        working-directory: lab/learner/affiliate-bot
        run: test -z "$(gofmt -l .)"

      - name: Vet learner Affiliate Bot
        working-directory: lab/learner/affiliate-bot
        run: go vet ./...

      - name: Test learner Affiliate Bot
        working-directory: lab/learner/affiliate-bot
        run: go test ./...
