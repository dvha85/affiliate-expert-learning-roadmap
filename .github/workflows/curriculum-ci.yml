name: Curriculum CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-curriculum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run curriculum validator
        run: python scripts/validate_curriculum.py

      - name: Run v2 lesson projection validator
        run: python scripts/validate_lesson_v2_map.py

      - name: Run Mission authoring-state validator
        run: python scripts/validate_mission_status.py

      - name: Run Mission readiness metadata validator
        run: python scripts/validate_readiness.py

      - name: Run learner-evidence privacy validator
        run: python scripts/validate_privacy_boundary.py

      - name: Run O00 synthetic safety validator
        run: python scripts/validate_o00.py

      - name: Run contract registry validator
        run: python scripts/validate_contract_registry.py

      - name: Run M00 market-loop evaluator pack
        run: python scripts/validate_m00_market_loop_pack.py

      - name: Run M00 market-evidence bundle evaluator
        run: python scripts/validate_m00_market_evidence_bundle.py

      - name: Run M01 outcome-snapshot evaluator pack
        run: python scripts/validate_m01_outcome_snapshot_pack.py

      - name: Run M02 deterministic evaluator pack
        run: python scripts/validate_m02_deterministic_pack.py

      - name: Run M02 Operator profile checks
        run: python scripts/validate_m02_profile_parity.py --operator-only

      - name: Run M03 history evaluator pack
        run: python scripts/validate_m03_history_pack.py

      - name: Run M04 grounded-advisory evaluator pack
        run: python scripts/validate_m04_grounded_advisory_pack.py

      - name: Run M05 reviewed-improvement evaluator pack
        run: python scripts/validate_m05_reviewed_improvement_pack.py

      - name: Run evidence taxonomy validator
        run: python scripts/validate_evidence_taxonomy.py

      - name: Run authority drift validator
        run: python scripts/validate_authority.py

      - name: Run Vietnamese language policy validator
        run: python scripts/validate_language_policy.py

      - name: Run Vietnamese heading validator
        run: python scripts/validate_vietnamese_headings.py

      - name: Run hardening validator
        run: python scripts/validate_hardening.py

      - name: Run Build-First semantic validator
        run: python scripts/validate_build_first.py

      - name: Run Agentic Architecture validator
        run: python scripts/validate_agentic_architecture.py

      - name: Run Hybrid Runtime validator
        run: python scripts/validate_hybrid_runtime.py

      - name: Test Build-First validator
        run: python -m unittest tests.test_build_first_validator -v

      - name: Test Agentic Architecture validator
        run: python -m unittest tests.test_agentic_architecture_validator -v

      - name: Test Hybrid Runtime validator
        run: python -m unittest tests.test_hybrid_runtime_validator -v

      - name: Test core validator regressions
        run: |
          python -m unittest -v \
            tests.test_contract_registry \
            tests.test_curriculum_validator \
            tests.test_evidence_taxonomy_validator \
            tests.test_hardening_validator \
            tests.test_lesson_v2_map \
            tests.test_mission_status_validator \
            tests.test_privacy_boundary_validator \
            tests.test_readiness_validator \
            tests.test_vietnamese_headings_validator

      - name: Test Mission evaluator regressions
        run: |
          python -m unittest -v \
            tests.test_m00_market_evidence_bundle \
            tests.test_m00_market_loop_pack \
            tests.test_m01_outcome_snapshot_pack \
            tests.test_m02_deterministic_pack \
            tests.test_m02_profile_parity \
            tests.test_m03_history_pack \
            tests.test_m04_grounded_advisory_pack \
            tests.test_m05_reviewed_improvement_pack

      - name: Test migration and scaffold regressions
        run: |
          python -m unittest -v \
            tests.test_migration_and_workspace \
            tests.test_o00 \
            tests.test_scaffold_lesson

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: lab/affiliate-bot/go.mod

      - name: Check reference Go formatting
        working-directory: lab/affiliate-bot
        run: test -z "$(gofmt -l .)"

      - name: Vet reference Affiliate Bot
        working-directory: lab/affiliate-bot
        run: go vet ./...

      - name: Test reference Affiliate Bot
        working-directory: lab/affiliate-bot
        run: go test ./...

      - name: Check learner Go formatting
        working-directory: lab/learner/affiliate-bot
        run: test -z "$(gofmt -l .)"

      - name: Vet learner Affiliate Bot
        working-directory: lab/learner/affiliate-bot
        run: go vet ./...

      - name: Test learner Affiliate Bot
        working-directory: lab/learner/affiliate-bot
        run: go test ./...

      - name: Check M02 Operator/Go profile parity
        run: python scripts/validate_m02_profile_parity.py
