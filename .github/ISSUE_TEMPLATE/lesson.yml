name: Lesson task
description: Theo dõi một knowledge slice cần author/apply trong Mission
title: "[Lesson] "
labels: ["lesson"]
body:
  - type: input
    id: lesson
    attributes:
      label: Mã và tên bài
      placeholder: "0.1 — Chạy, sửa và kiểm thử Bot đầu tiên"
    validations:
      required: true
  - type: checkboxes
    id: pass
    attributes:
      label: Applied criteria
      options:
        - label: Đã attempt trong Mission trước khi pull lesson
        - label: Đã áp dụng knowledge vào Bot/data/decision hiện tại
        - label: Đã chạy ít nhất một failure case liên quan
        - label: Đã lưu before/after artifact hoặc output
        - label: Explain-back được nguyên nhân, giới hạn và next action
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / artifact
  - type: textarea
    id: learning
    attributes:
      label: Learning và next action
